<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="placeholderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#placeholderGradient)"/>
  
  <!-- Head -->
  <circle cx="200" cy="120" r="50" fill="rgba(255,255,255,0.9)"/>
  
  <!-- Body -->
  <rect x="150" y="180" width="100" height="120" rx="20" fill="rgba(255,255,255,0.85)"/>
  
  <!-- Camera icon -->
  <g transform="translate(200, 200)" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-35" y="-30" width="70" height="60" rx="5"/>
    <circle cx="0" cy="0" r="20"/>
    <circle cx="20" cy="-15" r="3" fill="rgba(255,255,255,0.6)"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    Ganti dengan Fotomu
  </text>
</svg>