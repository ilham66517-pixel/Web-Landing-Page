<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="400" height="533" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="placeholderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:0.15" />
    </linearGradient>
    <pattern id="grid" x="40" y="40" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="533" fill="url(#placeholderGrad)"/>
  <rect width="400" height="533" fill="url(#grid)"/>

  <!-- Volleyball court lines -->
  <line x1="0" y1="266" x2="400" y2="266" stroke="rgba(37, 99, 235, 0.1)" stroke-width="2"/>

  <!-- Player silhouette -->
  <g opacity="0.3">
    <!-- Head -->
    <circle cx="200" cy="80" r="45" fill="rgba(255,255,255,0.4)"/>
    
    <!-- Body -->
    <ellipse cx="200" cy="200" rx="50" ry="80" fill="rgba(255,255,255,0.3)"/>
    
    <!-- Arms in volleyball pose -->
    <path d="M 150 160 Q 100 140 80 120" stroke="rgba(255,255,255,0.25)" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 250 160 Q 300 140 320 120" stroke="rgba(255,255,255,0.25)" stroke-width="20" fill="none" stroke-linecap="round"/>
    
    <!-- Legs -->
    <line x1="180" y1="270" x2="160" y2="400" stroke="rgba(255,255,255,0.25)" stroke-width="18" stroke-linecap="round"/>
    <line x1="220" y1="270" x2="240" y2="400" stroke="rgba(255,255,255,0.25)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Volleyball -->
  <g opacity="0.4" transform="translate(280, 140)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="rgba(249, 115, 22, 0.4)" stroke-width="3"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="rgba(249, 115, 22, 0.2)" stroke-width="1"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="rgba(249, 115, 22, 0.2)" stroke-width="1"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="rgba(249, 115, 22, 0.2)" stroke-width="1"/>
  </g>

  <!-- Instructional text -->
  <text x="200" y="480" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.5)">
    Tambahkan Foto Pemain
  </text>
  <text x="200" y="510" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.4)">
    Ganti assets/athlete-placeholder.svg
  </text>
</svg>