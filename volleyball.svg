<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Bola Voli" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="ballGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.1);stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main ball -->
  <circle cx="100" cy="100" r="90" fill="currentColor" opacity="0.9" filter="url(#shadow)"/>
  
  <!-- Gradient highlight -->
  <circle cx="100" cy="100" r="90" fill="url(#ballGradient)"/>
  
  <!-- Panel lines (volleyball pattern) -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical lines -->
    <path d="M100 10 Q120 50 120 100 Q120 150 100 190"/>
    <path d="M100 10 Q80 50 80 100 Q80 150 100 190"/>
    
    <!-- Horizontal curves -->
    <path d="M20 100 Q50 85 100 80 Q150 85 180 100"/>
    <path d="M20 100 Q50 115 100 120 Q150 115 180 100"/>
    
    <!-- Diagonal elements -->
    <path d="M50 60 L150 140"/>
    <path d="M150 60 L50 140"/>
  </g>
  
  <!-- Center circle -->
  <circle cx="100" cy="100" r="12" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
</svg>